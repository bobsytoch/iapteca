name: docker-image

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

# SECURITY FIXES:
# 1) Removed hardcoded secrets - now using GitHub Actions Secrets to prevent credential leakage
# 2) Changed image tagging from :latest to :${{ github.sha }} for reproducible builds
env:
  REGISTRY: docker.io
  IMAGE_NAME: bouncytorch/iapteca

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx eslint src --ext .ts,.tsx

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test:run

      - name: Build Next.js app
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push Docker image
        # BUILD SECURITY FIX: Use commit SHA as immutable tag instead of :latest to ensure reproducible builds and prevent image confusion attacks
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${IMAGE_NAME}:${{ github.sha }} \
            --push \
            .
