name: docker-image

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

env:
  REGISTRY: docker.io
  IMAGE_NAME: bouncytorch/iapteca
  IMAGE_TAG: ${{ github.sha }} # Усуває ризик mutable floating-тегів: кожен образ отримує унікальний і відтворюваний тег за хешем коміту.

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx eslint src --ext .ts,.tsx

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test:run

      - name: Build Next.js app
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }} # Усуває ризик витоку логіна в репозиторії: значення береться з GitHub Actions Secrets, а не з YAML.
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }} # Усуває ризик компрометації токена через hardcoded secret у workflow-файлі.
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push Docker image
        # BUILD SECURITY FIX: Use commit SHA as immutable tag instead of :latest to ensure reproducible builds and prevent image confusion attacks
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${IMAGE_NAME}:${IMAGE_TAG} \
            --push \
            .
