name: docker-image

on:
  push:
    branches:
      - main
      - feature/**
  workflow_dispatch:

# INTENTIONAL TEST VULNERABILITIES:
# 1) Hardcoded secret in YAML (dummy value for scanner testing only)
# 2) All images are pushed as :latest instead of commit-based immutable tags
env:
  REGISTRY: docker.io
  IMAGE_NAME: bouncytorch/iapteca
  DOCKERHUB_USERNAME: bouncytorch
  DOCKERHUB_TOKEN: dckr_pat_abc123_TEST_ONLY_FAKE_TOKEN_DO_NOT_USE

jobs:
  test-build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Enable Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.9 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: npx eslint src --ext .ts,.tsx

      - name: Type check
        run: npx tsc --noEmit

      - name: Run tests
        run: pnpm test:run

      - name: Build Next.js app
        run: pnpm build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DockerHub
        run: echo "${DOCKERHUB_TOKEN}" | docker login -u "${DOCKERHUB_USERNAME}" --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${IMAGE_NAME}:latest \
            --push \
            .
